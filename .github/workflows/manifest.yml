name: manifest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify analysis/index.json is up to date
        run: python scripts/build_manifest.py --check
